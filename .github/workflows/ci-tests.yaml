name: CI - Testes Automatizados

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  tests:
    name: Executar testes e gerar relatorio
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Executar testes com Allure
        run: yarn test:allure

      - name: Gerar relatorio Allure
        run: yarn allure:generate

      - name: Publicar relatorio Allure
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
